<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Krunker Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; touch-action: none; font-family: sans-serif; background: #000; }
        
        /* Ïðèöåë */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* UI */
        #ui {
            position: absolute; top: 10px; left: 10px;
            color: white; font-size: 20px; font-weight: bold;
            text-shadow: 1px 1px 0 #000; pointer-events: none; z-index: 5;
        }

        /* Ýêðàííûå êíîïêè óïðàâëåíèÿ */
        .controls-layer {
            position: absolute; bottom: 20px; width: 100%; height: 150px;
            pointer-events: none; display: flex; justify-content: space-between; padding: 0 20px;
            box-sizing: border-box; z-index: 10;
        }

        /* Äæîéñòèê (Çîíà) */
        #joystick-zone {
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
        }

        #joystick-knob {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Êíîïêà ñòðåëüáû */
        #shoot-btn {
            width: 80px; height: 80px;
            background: rgba(255, 0, 0, 0.6);
            border: 4px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; user-select: none;
        }
        #shoot-btn:active { background: rgba(255, 0, 0, 0.9); transform: scale(0.95); }

        /* Çîíà âðàùåíèÿ êàìåðû (ïðàâàÿ ïîëîâèíà ýêðàíà) */
        #look-zone {
            position: absolute; top: 0; right: 0; width: 50%; height: 100%;
            z-index: 1; /* Íèæå êíîïîê */
        }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20;
        }
        button.start { padding: 15px 30px; font-size: 20px; background: #f1c40f; border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">HP: <span id="hp">100</span> | Kills: <span id="score">0</span></div>

    <!-- Ýêðàí ñòàðòà -->
    <div id="start-screen">
        <h1>KRUNKER MOBILE</h1>
        <p>Ëåâûé ñòèê - Õîäèòü<br>Ïðàâàÿ ÷àñòü - Ñìîòðåòü<br>Êðàñíàÿ êíîïêà - Îãîíü</p>
        <button class="start" onclick="startGame()">ÍÀ×ÀÒÜ ÈÃÐÓ</button>
    </div>

    <!-- Óïðàâëåíèå -->
    <div class="controls-layer">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div id="shoot-btn">FIRE</div>
    </div>
    
    <!-- Íåâèäèìàÿ çîíà äëÿ âðàùåíèÿ êàìåðîé -->
    <div id="look-zone"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let camera, scene, renderer;
        let bullets = [];
        let enemies = [];
        let score = 0;
        let hp = 100;
        let isGameActive = false;
        let gun;

        // Ïåðåìåííûå äâèæåíèÿ
        let moveForward = 0; // -1 to 1
        let moveRight = 0;   // -1 to 1
        let playerVelocity = new THREE.Vector3();
        
        // Ïåðåìåííûå êàìåðû
        let camYaw = 0;
        let camPitch = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 0, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ñâåò
            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            scene.add(light);

            // Ïîë
            const floorGeo = new THREE.PlaneGeometry(500, 500);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // ßùèêè
            const boxGeo = new THREE.BoxGeometry(5, 5, 5);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xcd853f });
            for(let i=0; i<30; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set((Math.random()-0.5)*100, 2.5, (Math.random()-0.5)*100);
                scene.add(box);
            }

            // Îðóæèå
            const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 1);
            const gunMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.3, -0.3, -0.5);
            camera.add(gun);
            scene.add(camera);
            camera.position.y = 2; // Ðîñò èãðîêà

            setupControls();
            setInterval(spawnEnemy, 2000);
            animate();
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            isGameActive = true;
        }

        // --- ÓÏÐÀÂËÅÍÈÅ (ÒÅËÅÔÎÍ) ---
        function setupControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            const lookZone = document.getElementById('look-zone');
            const shootBtn = document.getElementById('shoot-btn');

            // Äæîéñòèê
            let joyStartX, joyStartY;
            joystickZone.addEventListener('touchstart', (e) => {
                joyStartX = e.touches[0].clientX;
                joyStartY = e.touches[0].clientY;
            });

            joystickZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const deltaX = e.touches[0].clientX - joyStartX;
                const deltaY = e.touches[0].clientY - joyStartY;
                
                // Îãðàíè÷èâàåì äâèæåíèå ðó÷êè
                const distance = Math.min(35, Math.sqrt(deltaX*deltaX + deltaY*deltaY));
                const angle = Math.atan2(deltaY, deltaX);
                
                const kx = Math.cos(angle) * distance;
                const ky = Math.sin(angle) * distance;
                
                knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;

                // Íîðìàëèçóåì ââîä (-1 äî 1)
                moveRight = kx / 35;
                moveForward = -(ky / 35); // Èíâåðñèÿ Y
            });

            joystickZone.addEventListener('touchend', () => {
                knob.style.transform = `translate(-50%, -50%)`;
                moveForward = 0;
                moveRight = 0;
            });

            // Âðàùåíèå êàìåðîé (Ïðàâàÿ ÷àñòü)
            let lastLookX, lastLookY;
            lookZone.addEventListener('touchstart', (e) => {
                lastLookX = e.touches[0].clientX;
                lastLookY = e.touches[0].clientY;
            });

            lookZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const x = e.touches[0].clientX;
                const y = e.touches[0].clientY;
                
                const sensitivity = 0.005;
                camYaw -= (x - lastLookX) * sensitivity;
                camPitch -= (y - lastLookY) * sensitivity;
                
                // Îãðàíè÷åíèå âçãëÿäà ââåðõ/âíèç
                camPitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, camPitch));

                lastLookX = x;
                lastLookY = y;
            });

            // Ñòðåëüáà
            shootBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                shoot();
            });
        }

        function shoot() {
            if(!isGameActive) return;
            
            // Àíèìàöèÿ
            gun.position.z = -0.3;
            setTimeout(() => gun.position.z = -0.5, 100);

            const bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(camera.position);
            
            // Íàïðàâëåíèå ïóëè ñîâïàäàåò ñ íàïðàâëåíèåì êàìåðû
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyEuler(new THREE.Euler(camPitch, camYaw, 0, 'YXZ'));
            
            bullet.userData = { velocity: direction.multiplyScalar(2) };
            scene.add(bullet);
            bullets.push(bullet);
        }

        function spawnEnemy() {
            if(!isGameActive) return;
            const geo = new THREE.BoxGeometry(2, 4, 2);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const enemy = new THREE.Mesh(geo, mat);
            
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 20;
            enemy.position.x = camera.position.x + Math.cos(angle) * dist;
            enemy.position.z = camera.position.z + Math.sin(angle) * dist;
            enemy.position.y = 2;
            
            scene.add(enemy);
            enemies.push(enemy);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(!isGameActive) return;

            // Ïðèìåíåíèå âðàùåíèÿ êàìåðû
            camera.rotation.set(camPitch, camYaw, 0, 'YXZ');

            // Äâèæåíèå èãðîêà
            const speed = 0.2;
            const direction = new THREE.Vector3();
            
            // Ïîëó÷àåì íàïðàâëåíèå "âïåðåä" îòíîñèòåëüíî ïîâîðîòà êàìåðû (òîëüêî Y)
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);

            camera.position.add(forward.multiplyScalar(moveForward * speed));
            camera.position.add(right.multiplyScalar(moveRight * speed));

            // Ïóëè
            for(let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.add(b.userData.velocity);
                if(b.position.distanceTo(camera.position) > 100) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            // Âðàãè
            for(let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.lookAt(camera.position);
                e.translateZ(0.08); // Ìåäëåííûå âðàãè

                if(e.position.distanceTo(camera.position) < 2) {
                    hp -= 1;
                    document.getElementById('hp').innerText = Math.floor(hp);
                    if(hp <= 0) {
                        alert("GAME OVER");
                        location.reload();
                    }
                }

                for(let j = bullets.length - 1; j >= 0; j--) {
                    if(e.position.distanceTo(bullets[j].position) < 2) {
                        scene.remove(e);
                        enemies.splice(i, 1);
                        scene.remove(bullets[j]);
                        bullets.splice(j, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        break;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
